# Development with hot reload:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
services:
  db:
    ports:
      - "127.0.0.1:3306:3306"

  api:
    build:
      target: dev
    environment:
      NODE_ENV: development
    volumes:
      - ./api:/app
      - /app/node_modules
      - epub-data:/app/epub

  web:
    build:
      target: dev
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      WATCHPACK_POLLING: "true"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
