# Production-like: docker compose up -d --build
services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
      MYSQL_DATABASE: ${MYSQL_DATABASE:-catshelf}
      MYSQL_USER: ${MYSQL_USER:-catshelf}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set in .env}
    volumes:
      - db-data:/var/lib/mysql
      # runs only on first start, when the data volume is empty
      - ./api/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      # use TCP: during first-run init the temp server only listens on the socket
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ./api
      target: prod
    restart: unless-stopped
    environment:
      MYSQL_HOST: db
      MYSQL_DATABASE: ${MYSQL_DATABASE:-catshelf}
      MYSQL_USER: ${MYSQL_USER:-catshelf}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?set in .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-false}
      TRUST_PROXY: ${TRUST_PROXY:-}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
    security_opt:
      - no-new-privileges:true
    ports:
      - "8000:8000"
    volumes:
      - epub-data:/app/epub
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      target: prod
      args:
        # URL the *browser* uses to reach the API
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  db-data:
  epub-data:
